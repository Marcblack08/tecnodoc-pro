<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoDoc Pro 2.0 - Plataforma Técnica Integral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{400:'#38bdf8',500:'#0ea5e9',600:'#0284c7',900:'#0c4a6e'}}}}}</script>
    <style>body{background-color:#020617;color:#e2e8f0;font-family:'Inter',sans-serif}.glass-card{background:rgba(30,41,59,.7);backdrop-filter:blur(12px);border:1px solid rgba(56,189,248,.15);border-radius:.75rem}.input-tech{background:rgba(15,23,42,.7);border:1px solid rgba(56,189,248,.2);color:white;padding:.5rem .75rem;border-radius:.375rem;width:100%}.input-tech:focus{outline:none;border-color:#38bdf8}.btn-tech{background:linear-gradient(90deg,#0ea5e9,#0284c7);color:white;padding:.5rem 1rem;border-radius:.375rem;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:.5rem;justify-content:center}.nav-item.active{background:rgba(14,165,233,.15);border-right:3px solid #38bdf8;color:#38bdf8}</style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">
<div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md"><div class="glass-card w-full max-w-md p-8"><div class="text-center mb-6"><i class="fa-solid fa-microchip text-4xl text-brand-400 mb-2"></i><h1 class="text-2xl font-bold text-white">TECNODOC <span class="text-brand-400">PRO 2.0</span></h1><p class="text-slate-400 text-xs mt-1">Gestión Técnica & Inteligencia Artificial</p></div><div class="flex border-b border-slate-700 mb-6 text-sm"><button id="tab-login" onclick="switchAuthTab('login')" class="w-1/2 py-2 text-brand-400 border-b-2 border-brand-400 font-semibold">Iniciar Sesión</button><button id="tab-register" onclick="switchAuthTab('register')" class="w-1/2 py-2 text-slate-400 font-semibold">Registrarse</button></div><form id="form-login" onsubmit="handleAuth(event,'login')" class="space-y-4"><input type="email" id="auth-email" class="input-tech text-sm" required placeholder="correo@ejemplo.com"><input type="password" id="auth-pwd" class="input-tech text-sm" required placeholder="••••••••"><button type="submit" class="btn-tech w-full">Ingresar <i class="fa-solid fa-arrow-right"></i></button></form><form id="form-register" onsubmit="handleAuth(event,'register')" class="space-y-3 hidden"><input type="email" id="reg-email" class="input-tech text-sm" required placeholder="correo@ejemplo.com"><input type="password" id="reg-pwd" class="input-tech text-sm" required placeholder="••••••••"><button type="submit" class="btn-tech w-full">Crear Cuenta</button></form></div></div>
<div id="app-container" class="hidden flex h-screen w-full overflow-hidden"><aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col h-full flex-shrink-0"><div class="p-5 border-b border-slate-800 flex items-center gap-3"><i class="fa-solid fa-microchip text-2xl text-brand-400"></i><h2 class="font-bold text-lg text-white">TecnoDoc<span class="text-brand-400">Pro</span></h2></div><nav class="p-4 flex-1 space-y-1 overflow-y-auto"><button onclick="nav('dashboard',this)" class="nav-item active w-full px-3 py-2.5 text-sm text-left">Dashboard</button><button onclick="nav('proformas',this)" class="nav-item w-full px-3 py-2.5 text-sm text-left">Proformas e IA</button><button onclick="nav('almacen',this)" class="nav-item w-full px-3 py-2.5 text-sm text-left">Almacén / Stock</button><button onclick="nav('clientes',this)" class="nav-item w-full px-3 py-2.5 text-sm text-left">Clientes</button><button onclick="nav('informes',this)" class="nav-item w-full px-3 py-2.5 text-sm text-left">Informes Técnicos</button><button onclick="nav('chat-ia',this)" class="nav-item w-full px-3 py-2.5 text-sm text-left">Asistente IA</button></nav><div class="p-4 border-t border-slate-800"><button onclick="logout()" class="text-red-400 text-sm">Cerrar Sesión</button></div></aside><main class="flex-1 flex flex-col h-full overflow-hidden bg-slate-950"><header class="h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6"><h2 id="view-title" class="font-semibold text-white">Dashboard</h2><span id="user-display-name" class="text-xs text-brand-400 font-mono"></span></header><div class="flex-1 overflow-y-auto p-6">
<div id="view-dashboard" class="view-section space-y-6"><div class="glass-card p-4"><p class="text-xs text-slate-400">Total Productos en Stock</p><h3 id="dash-prod-count" class="text-2xl font-bold text-brand-400">0</h3></div></div>
<div id="view-proformas" class="view-section hidden space-y-6"><div class="glass-card p-6 space-y-6"><h3 class="text-lg font-bold text-white">Generador de Proformas con Reconocimiento</h3><div class="bg-slate-900/80 p-4 rounded-lg border border-purple-500/30 space-y-4"><div class="grid grid-cols-1 md:grid-cols-3 gap-4"><div class="p-3 bg-slate-800/50 rounded text-center"><label class="block text-xs text-slate-300">Grabar Voz en Vivo</label><button id="record-btn" onclick="toggleMicRecord()" class="btn-tech w-full bg-purple-600 text-xs">Iniciar Grabación</button></div><div class="p-3 bg-slate-800/50 rounded"><label class="block text-xs text-slate-300">Subir Imagen / Lista</label><input type="file" id="ai-photo-input" accept="image/*" class="text-xs w-full"><button onclick="processPhotoIA()" class="btn-tech w-full text-xs">Procesar Foto</button></div><div class="p-3 bg-slate-800/50 rounded"><label class="block text-xs text-slate-300">Subir Audio</label><input type="file" id="ai-audio-input" accept="audio/*" class="text-xs w-full"><button onclick="processAudioFileIA()" class="btn-tech w-full text-xs">Procesar Audio</button></div></div><p id="ai-status" class="text-xs text-amber-400 font-mono hidden"></p></div><div class="grid grid-cols-12 gap-2"><input type="text" id="prof-item-desc" placeholder="Descripción" class="input-tech text-xs col-span-6"><input type="number" id="prof-item-qty" value="1" class="input-tech text-xs col-span-2"><input type="number" step="0.01" id="prof-item-price" placeholder="Precio" class="input-tech text-xs col-span-2"><button onclick="addProformaItemWithStockCheck()" class="btn-tech text-xs col-span-2">Añadir</button></div><table class="w-full text-left text-xs"><tbody id="proforma-tbody"></tbody></table><div class="text-right font-bold text-brand-400">Total: <span id="prof-total-val">S/ 0.00</span></div></div></div>
<div id="view-almacen" class="view-section hidden space-y-6"><div class="flex justify-between"><h3 class="text-lg font-semibold text-white">Inventario</h3><button onclick="openModal('modal-bulk-upload')" class="btn-tech bg-purple-600 text-xs">Carga Masiva IA</button></div><table class="w-full text-left"><tbody id="almacen-tbody"></tbody></table></div>
<div id="view-clientes" class="view-section hidden"><h3 class="text-lg font-semibold text-white">Clientes</h3><tbody id="clientes-tbody"></tbody></div>
<div id="view-informes" class="view-section hidden"><div class="glass-card p-6 space-y-4"><input id="report-client" class="input-tech" placeholder="Cliente"><input id="report-tech" class="input-tech" placeholder="Técnico"><textarea id="report-details" class="input-tech" placeholder="Detalles"></textarea><button onclick="generateTechnicalReportPDF()" class="btn-tech">Generar Informe PDF</button></div></div>
<div id="view-chat-ia" class="view-section hidden"><div class="glass-card p-4 h-[70vh] flex flex-col"><div id="chat-box" class="flex-1 overflow-y-auto space-y-3 p-2 text-xs"><div class="bg-purple-900/30 p-2.5 rounded text-slate-200">Hola. Pregúntame sobre tu almacén.</div></div><div class="flex gap-2"><input id="chat-input" class="input-tech text-xs" placeholder="¿Cuántas cámaras quedan?" onkeypress="if(event.key==='Enter')sendChatIA()"><button onclick="sendChatIA()" class="btn-tech">Enviar</button></div></div></div></div></main></div>
<div id="modal-bulk-upload" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 hidden"><div class="glass-card w-full max-w-md p-6 space-y-4"><h3 class="text-sm font-bold text-white">Carga Masiva por IA</h3><input type="file" id="bulk-file-input" accept="image/*,application/pdf" class="text-xs text-slate-300 w-full"><div class="flex justify-end gap-2"><button onclick="closeModal('modal-bulk-upload')">Cancelar</button><button onclick="processBulkInventoryIA()" class="btn-tech">Procesar</button></div></div></div>
<script>
const SUPABASE_URL='https://nozaqrgryxvdomtiwgsd.supabase.co';
const SUPABASE_KEY='sb_publishable_zeR7uHTUPHFThzWlb3CtFg_LGpGkT-Z';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,inventoryList=[],proformaItems=[],mediaRecorder=null,audioChunks=[],isRecording=false,recordingMimeType='';

function switchAuthTab(tab){document.getElementById('form-login').classList.toggle('hidden',tab!=='login');document.getElementById('form-register').classList.toggle('hidden',tab!=='register')}
async function handleAuth(e,type){e.preventDefault();const email=document.getElementById(type==='login'?'auth-email':'reg-email').value.trim();const password=document.getElementById(type==='login'?'auth-pwd':'reg-pwd').value;const result=type==='login'?await supabaseClient.auth.signInWithPassword({email,password}):await supabaseClient.auth.signUp({email,password});if(result.error)return alert('Error: '+result.error.message);if(result.data.user)initSession(result.data.user)}
function initSession(user){currentUser=user;document.getElementById('login-screen').classList.add('hidden');document.getElementById('app-container').classList.remove('hidden');document.getElementById('user-display-name').innerText=user.email;loadAlmacen();loadClientes()}
function logout(){supabaseClient.auth.signOut();location.reload()}
function nav(id,el){document.querySelectorAll('.view-section').forEach(v=>v.classList.add('hidden'));document.getElementById('view-'+id).classList.remove('hidden');document.querySelectorAll('.nav-item').forEach(v=>v.classList.remove('active'));if(el)el.classList.add('active');document.getElementById('view-title').innerText=id==='chat-ia'?'Asistente IA':id[0].toUpperCase()+id.slice(1)}

async function loadAlmacen(){const r=await supabaseClient.from('products').select('*').order('created_at',{ascending:false});if(r.error){console.error(r.error);return}inventoryList=r.data||[];document.getElementById('dash-prod-count').innerText=inventoryList.length;document.getElementById('almacen-tbody').innerHTML=inventoryList.map(p=>`<tr><td class="p-3 text-white">${escapeHtml(p.name)}</td><td class="p-3">${escapeHtml(p.category||'General')}</td><td class="p-3">${p.stock}</td><td class="p-3">S/ ${Number(p.sale_price||0).toFixed(2)}</td></tr>`).join('')}
async function loadClientes(){const r=await supabaseClient.from('clients').select('*');if(r.error){console.error(r.error);return}document.getElementById('clientes-tbody').innerHTML=(r.data||[]).map(c=>`<tr><td>${escapeHtml(c.name)}</td></tr>`).join('')}
function addProformaItemWithStockCheck(descVal,qtyVal,priceVal){const desc=descVal||document.getElementById('prof-item-desc').value.trim();const qty=Number(qtyVal||document.getElementById('prof-item-qty').value||1);const price=Number(priceVal??document.getElementById('prof-item-price').value||0);if(!desc)return;const p=inventoryList.find(x=>String(x.name).toLowerCase().includes(desc.toLowerCase()));if(p&&qty>p.stock)alert(`Stock insuficiente: ${p.name}. Disponible: ${p.stock}`);proformaItems.push({desc,qty,price,subtotal:qty*price});renderProformaTable();if(!descVal){document.getElementById('prof-item-desc').value='';document.getElementById('prof-item-price').value=''}}
function renderProformaTable(){const t=document.getElementById('proforma-tbody');let total=0;t.innerHTML=proformaItems.map((x,i)=>{total+=x.subtotal;return `<tr><td class="p-2">${x.qty}</td><td class="p-2">${escapeHtml(x.desc)}</td><td class="p-2">S/ ${x.price.toFixed(2)}</td><td class="p-2">S/ ${x.subtotal.toFixed(2)}</td><td><button onclick="removeProformaItem(${i})">🗑</button></td></tr>`}).join('');document.getElementById('prof-total-val').innerText=`S/ ${total.toFixed(2)}`}
function removeProformaItem(i){proformaItems.splice(i,1);renderProformaTable()}

function getSupportedRecordingMime(){const options=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];return options.find(x=>MediaRecorder.isTypeSupported(x))||''}
async function toggleMicRecord(){const btn=document.getElementById('record-btn');if(!isRecording){try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});recordingMimeType=getSupportedRecordingMime();mediaRecorder=recordingMimeType?new MediaRecorder(stream,{mimeType:recordingMimeType}):new MediaRecorder(stream);audioChunks=[];mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)audioChunks.push(e.data)};mediaRecorder.onstop=async()=>{try{const actualMime=mediaRecorder.mimeType||recordingMimeType||audioChunks[0]?.type||'audio/webm';const blob=new Blob(audioChunks,{type:actualMime});const b64=await toBase64(blob);await processIAData(b64.split(',')[1],actualMime,'Escucha esta voz y extrae los productos, cantidades y precios. Devuelve SOLO un arreglo JSON con objetos {"desc":"nombre","qty":1,"price":0}.');}finally{stream.getTracks().forEach(t=>t.stop())}};mediaRecorder.start();isRecording=true;btn.innerText='Detener Grabación';btn.classList.replace('bg-purple-600','bg-red-600')}catch(e){console.error(e);alert('No se pudo acceder al micrófono: '+e.message)}}else{mediaRecorder.stop();isRecording=false;btn.innerText='Iniciar Grabación';btn.classList.replace('bg-red-600','bg-purple-600')}}
async function processPhotoIA(){const f=document.getElementById('ai-photo-input').files[0];if(!f)return alert('Selecciona una imagen.');const b=await toBase64(f);await processIAData(b.split(',')[1],f.type,'Analiza esta imagen y extrae los ítems. Devuelve SOLO un arreglo JSON con objetos {"desc":"nombre","qty":1,"price":0}.')}
async function processAudioFileIA(){const f=document.getElementById('ai-audio-input').files[0];if(!f)return alert('Selecciona un archivo de audio.');const b=await toBase64(f);await processIAData(b.split(',')[1],f.type,'Escucha este audio y extrae los ítems. Devuelve SOLO un arreglo JSON con objetos {"desc":"nombre","qty":1,"price":0}.')}

function parseAIJson(text){let s=String(text||'').trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();try{return JSON.parse(s)}catch(e){const a=s.indexOf('['),b=s.lastIndexOf(']');if(a>=0&&b>a)return JSON.parse(s.slice(a,b+1));throw e}}
async function callAI(payload){const res=await fetch('/api/analizar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await res.json().catch(()=>({}));if(!res.ok||data.ok===false)throw new Error(data.error||`Error HTTP ${res.status}`);if(!data.text)throw new Error('La IA no devolvió texto.');return data.text}
async function processIAData(base64Data,mimeType,prompt){showStatus('Procesando con IA...');try{const text=await callAI({base64Data,mimeType,prompt});const items=parseAIJson(text);if(!Array.isArray(items))throw new Error('La IA no devolvió una lista de productos.');items.forEach(i=>addProformaItemWithStockCheck(i.desc,i.qty,i.price));showStatus(`✓ IA procesó ${items.length} producto(s).`)}catch(e){console.error('IA:',e);showStatus('✕ Error IA: '+e.message);alert('Error de IA: '+e.message)}}
async function processBulkInventoryIA(){const f=document.getElementById('bulk-file-input').files[0];if(!f)return alert('Selecciona un archivo PDF o Imagen.');showStatus('Procesando inventario...');try{const b=await toBase64(f);const text=await callAI({base64Data:b.split(',')[1],mimeType:f.type,prompt:'Analiza esta lista o PDF de inventario. Devuelve SOLO un arreglo JSON con objetos {"name":"Nombre","category":"Categoría","stock":10,"sale_price":15.00}.'});const items=parseAIJson(text);if(!Array.isArray(items))throw new Error('Formato de inventario inválido.');const formatted=items.map(i=>({user_id:currentUser.id,name:String(i.name||'Producto'),category:String(i.category||'General'),stock:Number(i.stock)||0,sale_price:Number(i.sale_price)||0}));const ins=await supabaseClient.from('products').insert(formatted);if(ins.error)throw new Error('Supabase: '+ins.error.message);closeModal('modal-bulk-upload');await loadAlmacen();alert(`✓ Se importaron ${formatted.length} productos.`)}catch(e){console.error('Inventario IA:',e);alert('Error importando inventario con IA: '+e.message)}}
async function sendChatIA(){const input=document.getElementById('chat-input'),msg=input.value.trim();if(!msg)return;const box=document.getElementById('chat-box');box.innerHTML+=`<div class="bg-slate-800 p-2.5 rounded text-white text-right">${escapeHtml(msg)}</div>`;input.value='';const context=JSON.stringify(inventoryList.map(p=>({producto:p.name,stock:p.stock,precio:p.sale_price})));try{const reply=await callAI({prompt:`Eres el asistente de TecnoDoc Pro. Inventario actual: ${context}. Responde en español de forma breve y exacta a: ${msg}`,textOnly:true});box.innerHTML+=`<div class="bg-purple-900/30 p-2.5 rounded border border-purple-500/20 text-slate-200">${escapeHtml(reply)}</div>`;box.scrollTop=box.scrollHeight}catch(e){console.error('Chat IA:',e);box.innerHTML+=`<div class="bg-red-900/30 p-2.5 rounded text-red-300">Error IA: ${escapeHtml(e.message)}</div>`}}
function showStatus(m){const e=document.getElementById('ai-status');e.innerText=m;e.classList.remove('hidden')}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function openModal(id){document.getElementById(id).classList.remove('hidden')}function closeModal(id){document.getElementById(id).classList.add('hidden')}
function toBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function generateTechnicalReportPDF(){const{jsPDF}=window.jspdf;const d=new jsPDF();d.text('INFORME TÉCNICO DE TRABAJO TERMINADO',14,20);d.text('Cliente: '+(document.getElementById('report-client').value||'Cliente General'),14,30);d.text('Técnico: '+(document.getElementById('report-tech').value||'Técnico Especialista'),14,36);d.text(d.splitTextToSize(document.getElementById('report-details').value||'',180),14,50);d.save('Informe_Tecnico.pdf')}
</script></body></html>
