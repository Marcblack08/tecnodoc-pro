<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoDoc Pro 2.0 - IA Integrada</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { brand: { 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7' } }
                }
            }
        }
    </script>
    <style>
        body { background-color: #020617; color: #e2e8f0; }
        .glass-card { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 0.75rem; }
        .input-tech { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(56, 189, 248, 0.2); color: white; padding: 0.5rem; border-radius: 0.375rem; width: 100%; }
        .btn-tech { background: linear-gradient(90deg, #0ea5e9, #0284c7); color: white; padding: 0.5rem 1rem; border-radius: 0.375rem; font-weight: 500; cursor: pointer; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-4xl mx-auto glass-card p-6 space-y-6">
        <h2 class="text-xl font-bold text-brand-400 flex items-center gap-2">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Formulario de Proforma con Asistente IA
        </h2>

        <div class="bg-slate-900/80 p-4 rounded-lg border border-purple-500/30 space-y-4">
            <p class="text-xs font-semibold text-purple-400 uppercase tracking-wider"><i class="fa-solid fa-robot mr-1"></i> Asistente de Carga Rápida Gemini IA</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="p-3 bg-slate-800/50 rounded border border-slate-700">
                    <label class="block text-xs text-slate-300 mb-2 font-medium"><i class="fa-solid fa-camera mr-1"></i> Escanear Foto (Lista o Etiqueta)</label>
                    <input type="file" id="ai-photo-input" accept="image/*" class="text-xs text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-brand-500 file:text-white">
                    <button onclick="processPhotoIA()" class="mt-2 text-xs bg-purple-600 hover:bg-purple-500 text-white py-1 px-3 rounded w-full"><i class="fa-solid fa-magnifying-glass"></i> Extraer Ítems de la Foto</button>
                </div>

                <div class="p-3 bg-slate-800/50 rounded border border-slate-700">
                    <label class="block text-xs text-slate-300 mb-2 font-medium"><i class="fa-solid fa-microphone mr-1"></i> Subir Audio con Descripción</label>
                    <input type="file" id="ai-audio-input" accept="audio/*" class="text-xs text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-brand-500 file:text-white">
                    <button onclick="processAudioIA()" class="mt-2 text-xs bg-purple-600 hover:bg-purple-500 text-white py-1 px-3 rounded w-full"><i class="fa-solid fa-file-audio"></i> Transcribir e Insertar Ítems</button>
                </div>
            </div>
            <p id="ai-status" class="text-xs text-amber-400 font-mono hidden"></p>
        </div>

        <div class="space-y-3">
            <div class="grid grid-cols-12 gap-2">
                <input type="text" id="item-desc" placeholder="Descripción" class="input-tech text-xs col-span-6">
                <input type="number" id="item-qty" placeholder="Cant." value="1" class="input-tech text-xs col-span-2">
                <input type="number" step="0.01" id="item-price" placeholder="Precio (S/)" class="input-tech text-xs col-span-2">
                <button onclick="addItem()" class="btn-tech text-xs col-span-2">Agregar</button>
            </div>

            <table class="w-full text-left text-xs border-collapse">
                <thead>
                    <tr class="bg-slate-800 text-slate-400 uppercase">
                        <th class="p-2">Cant.</th>
                        <th class="p-2">Descripción</th>
                        <th class="p-2">P. Unit</th>
                        <th class="p-2">Subtotal</th>
                    </tr>
                </thead>
                <tbody id="proforma-tbody" class="divide-y divide-slate-700"></tbody>
            </table>

            <div class="text-right text-sm font-bold text-brand-400 pt-2">
                Total: <span id="total-val">S/ 0.00</span>
            </div>
        </div>
    </div>

    <script>
        let items = [];

        function addItem(descVal, qtyVal, priceVal) {
            const desc = descVal || document.getElementById('item-desc').value;
            const qty = qtyVal || parseInt(document.getElementById('item-qty').value) || 1;
            const price = priceVal || parseFloat(document.getElementById('item-price').value) || 0;

            if(!desc) return;

            const subtotal = qty * price;
            items.push({ desc, qty, price, subtotal });
            renderTable();

            if(!descVal) {
                document.getElementById('item-desc').value = '';
                document.getElementById('item-price').value = '';
            }
        }

        function renderTable() {
            const tbody = document.getElementById('proforma-tbody');
            tbody.innerHTML = '';
            let total = 0;

            items.forEach(i => {
                total += i.subtotal;
                tbody.innerHTML += `
                    <tr>
                        <td class="p-2">${i.qty}</td>
                        <td class="p-2">${i.desc}</td>
                        <td class="p-2">S/ ${i.price.toFixed(2)}</td>
                        <td class="p-2">S/ ${i.subtotal.toFixed(2)}</td>
                    </tr>
                `;
            });

            document.getElementById('total-val').innerText = `S/ ${total.toFixed(2)}`;
        }

        // LLAMADA AL BACKEND OCULTO EN LUGAR DE A LA API DE GEMINI DIRECTA
        async function processPhotoIA() {
            const fileInput = document.getElementById('ai-photo-input');
            if(!fileInput.files[0]) { alert('Selecciona una imagen primero.'); return; }

            showStatus('Analizando imagen con IA...');
            const file = fileInput.files[0];
            const base64 = await toBase64(file);

            const prompt = "Analiza esta imagen de productos/equipos técnicos. Extrae los ítems en formato JSON estricto con esta estructura: [{\"desc\": \"nombre del producto\", \"qty\": 1, \"price\": 0.00}]. Si no hay precio explícito, pon 0.00.";

            try {
                const response = await fetch('/api/analizar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        base64Data: base64.split(',')[1],
                        mimeType: file.type,
                        prompt: prompt
                    })
                });

                const data = await response.json();
                const textResult = data.candidates[0].content.parts[0].text;
                parseAndAddItems(textResult);
                showStatus('¡Imagen procesada con éxito!');
            } catch (err) {
                showStatus('Error al procesar la imagen.');
            }
        }

        async function processAudioIA() {
            const fileInput = document.getElementById('ai-audio-input');
            if(!fileInput.files[0]) { alert('Selecciona un archivo de audio primero.'); return; }

            showStatus('Transcribiendo audio y extrayendo ítems...');
            const file = fileInput.files[0];
            const base64 = await toBase64(file);

            const prompt = "Escucha este audio técnico. Extrae todos los productos, cantidades y precios mencionados en este formato JSON estricto: [{\"desc\": \"nombre\", \"qty\": 1, \"price\": 0.00}].";

            try {
                const response = await fetch('/api/analizar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        base64Data: base64.split(',')[1],
                        mimeType: file.type,
                        prompt: prompt
                    })
                });

                const data = await response.json();
                const textResult = data.candidates[0].content.parts[0].text;
                parseAndAddItems(textResult);
                showStatus('¡Audio transcribido e insertado!');
            } catch (err) {
                showStatus('Error al procesar el audio.');
            }
        }

        function parseAndAddItems(jsonString) {
            try {
                const cleanJson = jsonString.replace(/```json/g, '').replace(/```/g, '').trim();
                const parsed = JSON.parse(cleanJson);
                parsed.forEach(item => {
                    addItem(item.desc, item.qty, item.price);
                });
            } catch (e) {
                console.log('Error parsing JSON', jsonString);
            }
        }

        function showStatus(msg) {
            const el = document.getElementById('ai-status');
            el.innerText = msg;
            el.classList.remove('hidden');
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
