<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoDoc Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div id="login-screen" class="w-full max-w-md bg-slate-800 p-6 rounded-xl shadow-2xl border border-slate-700">
        <h1 class="text-2xl font-bold text-center text-blue-400 mb-6">TecnoDoc Pro</h1>

        <div class="flex border-b border-slate-700 mb-6">
            <button id="tab-login" onclick="switchAuthTab('login')" class="w-1/2 py-2 text-center text-blue-400 border-b-2 border-blue-400 font-semibold">Iniciar Sesión</button>
            <button id="tab-register" onclick="switchAuthTab('register')" class="w-1/2 py-2 text-center text-slate-400 hover:text-white font-semibold">Registrarse</button>
        </div>

        <form id="form-login" onsubmit="handleAuth(event, 'login')" class="space-y-4">
            <div>
                <label class="block text-sm text-slate-300 mb-1">Correo Gmail</label>
                <input type="email" id="auth-email" required class="w-full p-2.5 rounded bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-1">Contraseña</label>
                <input type="password" id="auth-pwd" required class="w-full p-2.5 rounded bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded transition">Ingresar</button>
        </form>

        <form id="form-register" onsubmit="handleAuth(event, 'register')" class="space-y-4 hidden">
            <div>
                <label class="block text-sm text-slate-300 mb-1">Nombre Completo</label>
                <input type="text" id="reg-name" required class="w-full p-2.5 rounded bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-1">Nombre de la Empresa</label>
                <input type="text" id="reg-company" required class="w-full p-2.5 rounded bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-1">Correo Gmail</label>
                <input type="email" id="reg-email" required class="w-full p-2.5 rounded bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-1">Contraseña</label>
                <input type="password" id="reg-pwd" required class="w-full p-2.5 rounded bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-2.5 rounded transition">Crear Cuenta</button>
        </form>
    </div>

    <div id="app-container" class="hidden w-full max-w-4xl bg-slate-800 p-8 rounded-xl shadow-2xl border border-slate-700 text-center">
        <h2 class="text-3xl font-bold text-green-400 mb-2">¡Bienvenido al Sistema!</h2>
        <p class="text-slate-300 mb-6">Has iniciado sesión correctamente como: <span id="user-display-name" class="font-bold text-blue-400"></span></p>
        <button onclick="logout()" class="bg-red-600 hover:bg-red-500 text-white font-bold px-6 py-2 rounded transition">Cerrar Sesión</button>
    </div>

    <script>
        // TUS DATOS DE SUPABASE INTEGRADOS
        const SUPABASE_URL = 'https://nozaqrgryxvdomtiwgsd.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_zeR7uHTUPHFThzWlb3CtFg_LGpGkT-Z';

        // Conectar con Supabase
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Cambiar entre Pestañas
        function switchAuthTab(tab) {
            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');

            if (tab === 'login') {
                formLogin.classList.remove('hidden');
                formRegister.classList.add('hidden');
                tabLogin.className = 'w-1/2 py-2 text-center text-blue-400 border-b-2 border-blue-400 font-semibold';
                tabRegister.className = 'w-1/2 py-2 text-center text-slate-400 hover:text-white font-semibold';
            } else {
                formLogin.classList.add('hidden');
                formRegister.classList.remove('hidden');
                tabRegister.className = 'w-1/2 py-2 text-center text-blue-400 border-b-2 border-blue-400 font-semibold';
                tabLogin.className = 'w-1/2 py-2 text-center text-slate-400 hover:text-white font-semibold';
            }
        }

        // Manejar Login y Registro
        async function handleAuth(e, type) {
            e.preventDefault();

            if (type === 'login') {
                const email = document.getElementById('auth-email').value;
                const password = document.getElementById('auth-pwd').value;

                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

                if (error) {
                    alert('Error: ' + error.message);
                } else {
                    alert('¡Ingreso exitoso!');
                    entrarAlSistema(data.user);
                }
            } else {
                const email = document.getElementById('reg-email').value;
                const password = document.getElementById('reg-pwd').value;

                const { data, error } = await supabaseClient.auth.signUp({
                    email,
                    password
                });

                if (error) {
                    alert('Error en registro: ' + error.message);
                } else {
                    alert('¡Registro enviado con éxito! Revisa tu correo Gmail para confirmar la cuenta.');
                    switchAuthTab('login');
                }
            }
        }

        function entrarAlSistema(user) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('user-display-name').innerText = user.email;
        }

        function logout() {
            supabaseClient.auth.signOut();
            window.location.reload();
        }
